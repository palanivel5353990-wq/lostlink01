<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOSTLINK | Secure Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top,#082f49,#020617 55%);
    color:white;
}

.login-container{
    width:380px;
    padding:35px;
    background:rgba(15,23,42,.92);
    border:1px solid #164e63;
    border-radius:20px;
    box-shadow:0 0 40px rgba(14,165,233,.15);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo-icon{
    font-size:45px;
    margin-bottom:8px;
}

.logo h1{
    color:#38bdf8;
    font-size:32px;
    letter-spacing:3px;
}

.logo p{
    color:#64748b;
    font-size:12px;
    margin-top:6px;
}

.input-box{
    margin-bottom:18px;
}

.input-box label{
    display:block;
    color:#94a3b8;
    font-size:13px;
    margin-bottom:7px;
}

.input-box input{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #334155;
    background:#020617;
    color:white;
    outline:none;
    font-size:14px;
}

.input-box input:focus{
    border-color:#38bdf8;
    box-shadow:0 0 8px rgba(56,189,248,.2);
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:#64748b;
    margin-bottom:20px;
}

.options a{
    color:#38bdf8;
    text-decoration:none;
}

.login-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:9px;
    background:#0284c7;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:#0369a1;
    box-shadow:0 0 20px rgba(14,165,233,.3);
}

.security{
    text-align:center;
    color:#475569;
    font-size:11px;
    margin-top:22px;
}

.status{
    text-align:center;
    margin-top:15px;
    font-size:12px;
    color:#f87171;
    display:none;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#334155;
    font-size:10px;
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <div class="logo-icon">📡</div>
        <h1>LOSTLINK</h1>
        <p>OFF-GRID DEVICE RECOVERY SYSTEM</p>
    </div>

    <form onsubmit="login(event)">

        <div class="input-box">
            <label>USER ID</label>
            <input
                type="text"
                id="username"
                placeholder="Enter User ID"
                required>
        </div>

        <div class="input-box">
            <label>PASSWORD</label>
            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required>
        </div>

        <div class="options">
            <span>🔒 Secure Access</span>
            <a href="#">Forgot Password?</a>
        </div>

        <button class="login-btn" type="submit">
            LOGIN TO LOSTLINK
        </button>

    </form>

    <div class="status" id="error">
        ❌ Invalid User ID or Password
    </div>

    <div class="security">
        🛡️ Protected Emergency Tracking Network
    </div>

    <div class="footer">
        LOSTLINK © 2026 | LoRaWAN Emergency Recovery
    </div>

</div>


<script>

function login(event){

    event.preventDefault();

    let username =
        document.getElementById("username").value;

    let password =
        document.getElementById("password").value;

    /*
       DEMO LOGIN

       User ID: admin
       Password: lostlink123
    */

    if(username === "admin" &&
       password === "lostlink123"){

        // Dashboard page
        window.location.href = "dashboard.html";

    }else{

        document.getElementById("error")
        .style.display = "block";

    }

}

</script>

</body>
</html>
